server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: faceswap-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:faceswap}
    username: ${POSTGRES_USER:faceswap}
    password: ${POSTGRES_PASSWORD:faceswap}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 15m
    refresh-ttl: 30d
    media-ttl: 2h
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:faceswap}
  limits:
    max-video-bytes: 209715200
    max-image-bytes: 10485760
    max-active-jobs-per-user: 3
  rate-limit:
    auth-per-minute: 20
    uploads-per-hour: 60
    jobs-per-hour: 30
