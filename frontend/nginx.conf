# Gateway: serves the SPA and reverse-proxies the API and WebSocket to the backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 250m;
    server_tokens off;

    # Resolve the backend through Docker DNS at request time; a static proxy_pass host is resolved
    # once at startup and keeps pointing at the old IP after the backend container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Stream uploads to the backend instead of buffering 200 MB on the gateway's disk first.
        proxy_request_buffering off;
    }

    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
